[project]
name = "minic-compiler-explorer"
version = "0.1.0"
description = "Educational recursive descent compiler for MiniC with a visual compiler explorer"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: browser end-to-end tests (need Playwright)"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP042"]
